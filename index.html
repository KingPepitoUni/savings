<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Savings Tracker</title>
<meta name="description" content="Personal monthly savings tracker. Data stays on this device.">
<meta name="theme-color" content="#f4f4f1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111110" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Savings">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>
:root{
  color-scheme: light;
  --bg:#f4f4f1; --surface:#fcfcfb; --surface-2:#f0efec; --border:#e4e3df;
  --text:#0b0b0b; --text-2:#52514e; --muted:#8a8984;
  --accent:#2a78d6; --accent-ink:#ffffff;
  --good:#0ca30c; --good-text:#006300; --warn:#fab219; --warn-bg:#fff4dc; --warn-text:#6b4a00;
  --crit:#d03b3b; --crit-text:#b02a2a;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --s5:#e87ba4; --s6:#008300; --s7:#6250d6; --s8:#e34948;
  --radius:14px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --bg:#111110; --surface:#1a1a19; --surface-2:#262624; --border:#2e2e2b;
    --text:#f0efec; --text-2:#c3c2b7; --muted:#8f8e86;
    --accent:#3987e5;
    --good-text:#4cc34c; --warn-bg:#3a2f12; --warn-text:#fad27a; --crit-text:#ef7b7b;
    --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#008300; --s7:#9085e9; --s8:#e66767;
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --bg:#111110; --surface:#1a1a19; --surface-2:#262624; --border:#2e2e2b;
  --text:#f0efec; --text-2:#c3c2b7; --muted:#8f8e86;
  --accent:#3987e5;
  --good-text:#4cc34c; --warn-bg:#3a2f12; --warn-text:#fad27a; --crit-text:#ef7b7b;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#008300; --s7:#9085e9; --s8:#e66767;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text)}
body{font:15px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%;
  padding:env(safe-area-inset-top) 0 calc(72px + env(safe-area-inset-bottom));overscroll-behavior-y:none}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
.num{font-variant-numeric:tabular-nums}
main{max-width:560px;margin:0 auto;padding:8px 16px 24px}
header.top{display:flex;align-items:center;justify-content:space-between;max-width:560px;margin:0 auto;padding:12px 16px 4px}
header.top h1{font-size:28px;margin:0;letter-spacing:-.02em}
.icon-btn{background:none;border:0;padding:8px;margin:-8px;color:var(--text-2);display:grid;place-items:center}
.icon-btn svg{width:24px;height:24px}
.sub{color:var(--text-2);font-size:13px}
.muted{color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;margin:12px 0}
.card h2{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;color:var(--text-2);margin:0 0 10px}
.card h3{font-size:16px;margin:0}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.row + .row{margin-top:6px}
.hero{font-size:36px;font-weight:700;letter-spacing:-.02em;line-height:1.1}
.delta{font-size:14px;font-weight:600}
.up{color:var(--good-text)} .down{color:var(--crit-text)}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.tile{background:var(--surface-2);border-radius:10px;padding:8px 10px;min-width:0}
.tile .l{font-size:12px;color:var(--text-2)} .tile .v{font-size:16px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar{height:8px;background:var(--surface-2);border-radius:4px;overflow:hidden;margin:6px 0 2px}
.bar > i{display:block;height:100%;background:var(--accent);border-radius:4px}
.bar.good > i{background:var(--good)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--border);background:var(--surface);border-radius:12px;padding:10px 14px;font-weight:600}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.block{display:flex;width:100%}
.btn.danger{color:var(--crit-text)}
.btn.small{padding:6px 10px;font-size:13px;border-radius:10px}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.banner{display:flex;gap:10px;align-items:center;background:var(--warn-bg);color:var(--warn-text);border-radius:var(--radius);padding:12px 14px;margin:8px 0;border:1px solid var(--warn)}
.banner svg{flex:none;width:22px;height:22px}
.banner .grow{flex:1}
.banner .btn{border-color:var(--warn);background:transparent;color:inherit}
.tip{background:var(--surface-2);border-radius:var(--radius);padding:10px 12px;font-size:13px;color:var(--text-2);margin:8px 0;display:flex;gap:8px;align-items:flex-start}
.list{list-style:none;margin:0;padding:0}
.list li{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--border)}
.list li:first-child{border-top:0}
.list .grow{flex:1;min-width:0}
.list .name{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sw{width:10px;height:10px;border-radius:3px;flex:none;display:inline-block}
.chip{display:inline-block;font-size:12px;background:var(--surface-2);border-radius:999px;padding:2px 8px;margin:2px 4px 0 0;color:var(--text-2)}
.tag-warn{color:var(--crit-text);font-weight:600}
.seg{display:inline-flex;background:var(--surface-2);border-radius:10px;padding:2px}
.seg button{border:0;background:none;padding:4px 10px;border-radius:8px;font-size:13px;color:var(--text-2)}
.seg button.on{background:var(--surface);color:var(--text);box-shadow:0 1px 2px rgba(0,0,0,.12)}
/* chart */
.chart-wrap{position:relative;touch-action:pan-y}
.chart-wrap svg{display:block;width:100%;height:auto}
.axis text{fill:var(--muted);font-size:10px}
.grid line{stroke:var(--border);stroke-width:1}
.ttip{position:absolute;pointer-events:none;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:8px 10px;font-size:12px;box-shadow:0 4px 16px rgba(0,0,0,.15);min-width:150px;display:none;z-index:2}
.ttip .row + .row{margin-top:2px}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:var(--text-2);margin-top:8px}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend .ln{width:14px;height:0;border-top:2px dashed var(--text)}
.legend .ln.trend{border-top:2px dotted var(--text-2)}
/* flow diagram */
.fl-title{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;color:var(--text-2);margin:20px 2px 4px}
.fl-in{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:8px}
.fl-chip{border:1px solid color-mix(in srgb,var(--good) 40%,var(--border));background:color-mix(in srgb,var(--good) 14%,var(--surface));border-radius:999px;padding:6px 12px;font-size:14px}
.fl-chip.dad{border:1.5px dashed var(--s7);background:var(--surface)}
.fl-arrow{text-align:center;color:var(--muted);font-size:18px;line-height:1;margin:4px 0 -6px}
.fl-link{display:flex;justify-content:center;position:relative;margin:-4px 0}
.fl-link::before{content:'';position:absolute;left:50%;top:0;bottom:0;border-left:2px solid var(--border)}
.fl-link span{position:relative;background:var(--bg);border:1px solid var(--border);border-radius:999px;padding:4px 12px;font-size:14px;font-weight:600;margin:8px 0}
.fl-hub{margin-top:8px}
.fl-bar{display:flex;gap:2px;height:12px;border-radius:6px;overflow:hidden;margin:10px 0 4px}
.fl-bar i{display:block;min-width:3px}
/* nav */
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border-top:1px solid var(--border);display:flex;justify-content:space-around;padding:6px 4px calc(6px + env(safe-area-inset-bottom));z-index:5}
nav.tabs a{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--muted);text-decoration:none;padding:2px 0}
nav.tabs a svg{width:24px;height:24px}
nav.tabs a.on{color:var(--accent)}
/* sheet */
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:10;display:none}
.sheet{position:fixed;left:0;right:0;bottom:0;top:max(24px,env(safe-area-inset-top));background:var(--bg);border-radius:16px 16px 0 0;z-index:11;display:none;flex-direction:column;max-width:560px;margin:0 auto}
.sheet.open,.sheet-bg.open{display:flex}
.sheet-bg.open{display:block}
.sheet header{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--border)}
.sheet header b{font-size:16px}
.sheet header button{background:none;border:0;color:var(--accent);font-weight:600;padding:6px 0;min-width:60px}
.sheet header button:first-child{text-align:left;font-weight:400}
.sheet header button:last-child{text-align:right}
.sheet .body{overflow-y:auto;padding:8px 16px calc(24px + env(safe-area-inset-bottom));flex:1;-webkit-overflow-scrolling:touch}
.field{display:block;margin:12px 0}
.field > span{display:block;font-size:13px;color:var(--text-2);margin-bottom:4px}
.field input:not([type=checkbox]),.field select{width:100%;padding:11px 12px;border:1px solid var(--border);border-radius:10px;background:var(--surface);font-size:16px;min-height:44px}
.field .hint{font-size:12px;color:var(--muted);margin-top:4px}
.checks label{display:flex;align-items:center;gap:10px;padding:8px 0}
.checks input,.check input{width:22px;height:22px;accent-color:var(--accent)}
.check{display:flex;align-items:center;gap:10px;margin:12px 0}
.upd li{padding:8px 0}
.upd input{width:130px;text-align:right;padding:10px 12px;border:1px solid var(--border);border-radius:10px;background:var(--surface);font-size:17px;font-variant-numeric:tabular-nums}
.upd input:focus{outline:2px solid var(--accent);border-color:transparent}
.month-pick{display:flex;align-items:center;justify-content:space-between;margin:8px 0}
.month-pick b{font-size:18px}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:14px;z-index:20;opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1}
table.hist{width:100%;border-collapse:collapse;font-size:13px}
table.hist td,table.hist th{padding:6px 4px;border-top:1px solid var(--border);text-align:right}
table.hist th{color:var(--text-2);font-weight:600;border-top:0}
table.hist td:first-child,table.hist th:first-child{text-align:left}
details summary{cursor:pointer;color:var(--accent);font-size:14px;padding:6px 0;list-style:none}
details summary::-webkit-details-marker{display:none}
.empty{text-align:center;padding:24px 8px;color:var(--text-2)}
.welcome{text-align:center;padding:40px 8px}
.welcome h1{font-size:28px;margin:12px 0 4px}
.row.sep{border-top:1px solid var(--border);padding-top:6px}
.rank{flex:none;display:grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--accent);color:var(--accent-ink);font-size:13px;font-weight:700}
.house-mini{display:flex;gap:12px;align-items:center;text-decoration:none;color:inherit;margin-top:12px;padding-top:12px;border-top:1px solid var(--border)}
.house-ic svg{display:block;width:100%;height:auto}
.house-ic{position:relative}
.lvlup svg{animation:pop .9s cubic-bezier(.3,1.5,.5,1)}
.lvlup::after{content:'✨';position:absolute;top:-4px;right:0;font-size:22px;opacity:0;animation:spark 1.4s ease-out .3s}
@keyframes pop{0%{transform:scale(.5) translateY(16px);opacity:0}70%{transform:scale(1.08)}100%{transform:none;opacity:1}}
@keyframes spark{0%{opacity:0;transform:scale(.3)}40%{opacity:1;transform:scale(1.3)}100%{opacity:0;transform:translateY(-12px)}}
@media (prefers-reduced-motion:reduce){.lvlup svg,.lvlup::after{animation:none}}
.ok{color:var(--good-text);font-weight:600}
.ko{color:var(--crit-text);font-weight:600}
</style>
</head>
<body>
<header class="top"><h1 id="title">Home</h1>
  <button class="icon-btn" data-action="settings" aria-label="Settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
</header>
<main id="app"></main>
<nav class="tabs" id="tabs">
  <a href="#home" data-tab="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>Home</a>
  <a href="#savings" data-tab="savings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="18" height="14" rx="2"/><path d="M3 10h18M16 15h2M7 6V4h10v2"/></svg>Savings</a>
  <a href="#flows" data-tab="flows"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="4.5" r="2"/><circle cx="5" cy="19.5" r="2"/><circle cx="19" cy="19.5" r="2"/><path d="M12 6.5v4M12 10.5c-5 0-7 3-7 7M12 10.5c5 0 7 3 7 7"/></svg>Flows</a>
  <a href="#dreams" data-tab="dreams"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m12 3 2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1-4.4-4.3 6.1-.9z"/></svg>Dreams</a>
  <a href="#owed" data-tab="owed"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h13l-3-3M20 17H7l3 3"/></svg>Owed</a>
</nav>
<div class="sheet-bg" id="sheetBg"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true"></div>
<div class="toast" id="toast"></div>
<input type="file" id="importFile" accept=".json,application/json" hidden>

<script>
'use strict';
const KEY = 'savings-tracker-v1';
const XLSX_URL = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
const MN = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const ML = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const GROUPS = {cash:'Cash', stocks:'Stocks', alstom:'Company shares'};
const ROLES = {checking:'Checking (money passes through)', savings:'Savings account', spending:'Spending (money is spent)', investment:'Investment'};

const DEFAULT_STATE = () => ({
  version: 1,
  accounts: [
    {id:'checking', name:'Checking', group:'cash', role:'checking', color:1},
    {id:'savings', name:'Savings account', group:'cash', role:'savings', color:3},
    {id:'broker', name:'Brokerage', group:'stocks', role:'investment', color:6}
  ],
  parties: [{id:'salary', name:'Salary', kind:'income'}],
  flows: [], snapshots: {}, dreams: [],
  owed: {recurring: [], items: []},
  settings: {targetMode:'auto', target:0, sharesRatio:50, goalStart:null, lastBackup:null, hideInstallTip:false, house:HOUSE_DEFAULT()}
});
/* house project: older property + renovation (Lille market prices) */
const HOUSE_DEFAULT = () => ({type:'house', priceFlat:3370, priceHouse:3540, pricesUpdated:'2026-08', discount:20, reno:'medium',
  renoCost:{light:400, medium:800, heavy:1500}, downPct:10, notaryPct:7.5, guaranteePct:1.2, bankFee:1000, lastLevel:null, lastMonth:null});
const RENO = {light:'Light (paint, floors)', medium:'Medium (kitchen, bathroom, electrics)', heavy:'Heavy (full: insulation, windows)'};
const LEVELS = [{min:0, name:'Damaged studio'}, {min:20, name:'Studio in renovation'}, {min:40, name:'Renovated flat'}, {min:60, name:'Large flat'},
  {min:80, name:'Duplex'}, {min:100, name:'House'}, {min:150, name:'Large house with garden'}];

/* ---------- storage ---------- */
let S = null;
function load(){
  try { const raw = localStorage.getItem(KEY); return raw ? normalize(JSON.parse(raw)) : null; }
  catch(e){ return null; }
}
function normalize(d){
  const base = DEFAULT_STATE();
  d.accounts ??= []; d.parties ??= []; d.flows ??= []; d.snapshots ??= {}; d.dreams ??= [];
  d.owed ??= {}; d.owed.recurring ??= []; d.owed.items ??= [];
  d.settings = Object.assign(base.settings, d.settings || {});
  const hd = HOUSE_DEFAULT();
  d.settings.house = Object.assign(hd, d.settings.house || {});
  d.settings.house.renoCost = Object.assign(HOUSE_DEFAULT().renoCost, d.settings.house.renoCost || {});
  if (!d.dreams.some(x => x.kind === 'house')) { const h = d.dreams.find(x => /house|maison/i.test(x.name)); if (h) h.kind = 'house'; }
  if (d.dreams.some(x => x.order == null))   // first run of priorities: start from deadline order
    [...d.dreams].sort((a, b) => (a.order ?? 1e9) - (b.order ?? 1e9) || (a.deadline || '9999').localeCompare(b.deadline || '9999')).forEach((x, i) => x.order = i + 1);
  return d;
}
function save(){
  try { localStorage.setItem(KEY, JSON.stringify(S)); }
  catch(e){ alert('Could not save on this device: ' + e.message + '\nExport a backup now.'); }
}

/* ---------- helpers ---------- */
const $ = (s, el=document) => el.querySelector(s);
const pad = n => String(n).padStart(2,'0');
const ym = d => d.getFullYear() + '-' + pad(d.getMonth()+1);
const addM = (m, n) => { let [y, mo] = m.split('-').map(Number); mo += n - 1; y += Math.floor(mo/12); mo = ((mo % 12) + 12) % 12 + 1; return y + '-' + pad(mo); };
const mDiff = (a, b) => { const [ay, am] = a.split('-').map(Number), [by, bm] = b.split('-').map(Number); return (by*12 + bm) - (ay*12 + am); };
const mLabel = (m, long) => { if (!m) return '–'; const [y, mo] = m.split('-').map(Number); return long ? `${ML[mo-1]} ${y}` : `${MN[mo-1]} ${String(y).slice(2)}`; };
const range = (a, b) => { const out = []; for (let m = a; m <= b; m = addM(m, 1)) out.push(m); return out; };
const nf0 = new Intl.NumberFormat('en-IE', {style:'currency', currency:'EUR', maximumFractionDigits:0});
const nf2 = new Intl.NumberFormat('en-IE', {style:'currency', currency:'EUR', minimumFractionDigits:2, maximumFractionDigits:2});
const eur = (n, d) => (n == null || isNaN(n)) ? '–' : (d ? nf2 : nf0).format(n);
const signed = (n, d) => (n > 0.004 ? '+' : n < -0.004 ? '−' : '') + eur(Math.abs(n), d);
const kfmt = v => Math.abs(v) >= 1000 ? (v/1000).toFixed(v % 1000 ? 1 : 0).replace('.0','') + 'k' : String(Math.round(v));
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num = v => { if (v == null) return null; const s = String(v).replace(/[\s€]/g,'').replace(',', '.'); if (s === '') return null; const n = parseFloat(s); return isFinite(n) ? Math.round(n*100)/100 : null; };
const uid = () => Math.random().toString(36).slice(2, 9);
const today = () => new Date();
const color = a => `var(--s${((a?.color ?? 1) - 1) % 8 + 1})`;
function toast(msg){ const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('show'), 2200); }

/* ---------- model ---------- */
const acc = id => S.accounts.find(a => a.id === id);
const party = id => S.parties.find(p => p.id === id);
const node = id => acc(id) || party(id);
const nodeName = id => node(id)?.name ?? '(deleted)';
const activeAccounts = () => S.accounts.filter(a => !a.archived);
const hasSnap = m => { const s = S.snapshots[m]; return !!s && Object.values(s).some(v => v != null); };
const snapMonths = () => Object.keys(S.snapshots).filter(hasSnap).sort();

function valueAt(a, m){
  const v = S.snapshots[m]?.[a.id];
  if (v != null) return v;
  if (a.group === 'alstom') {           // yearly: carry the last known value forward
    const prev = snapMonths().filter(x => x < m && S.snapshots[x][a.id] != null);
    if (prev.length) return S.snapshots[prev[prev.length-1]][a.id];
  }
  return null;
}
function lastValue(a, before){
  const ms = Object.keys(S.snapshots).filter(m => (!before || m < before) && S.snapshots[m][a.id] != null).sort();
  return ms.length ? S.snapshots[ms[ms.length-1]][a.id] : null;
}
function totalsAt(m){
  const t = {cash:0, stocks:0, alstom:0};
  for (const a of S.accounts) { const v = valueAt(a, m); if (v != null) t[a.group] += v; }
  t.liquid = t.cash + t.stocks; t.net = t.liquid + t.alstom;
  return t;
}

/* money advanced to Dad */
function materialize(){
  const now = ym(today());
  for (const r of S.owed.recurring) {
    if (!r.startMonth) continue;
    const end = r.endMonth && r.endMonth < now ? r.endMonth : now;
    for (const m of range(r.startMonth, end))
      if (!S.owed.items.some(i => i.recId === r.id && i.month === m))
        S.owed.items.push({id:uid(), recId:r.id, label:r.label, amount:r.amount, month:m, expectedMonth:m, received:false});
  }
}
const owedAt = m => S.owed.items.filter(i => i.month <= m && !(i.received && (i.receivedOn || i.month) <= m)).reduce((s, i) => s + i.amount, 0);
const owedNow = () => S.owed.items.filter(i => !i.received).reduce((s, i) => s + i.amount, 0);

/* what was saved between the previous update and month m */
function savedFor(m){
  const prev = snapMonths().filter(x => x < m);
  if (!hasSnap(m) || !prev.length) return null;
  const p = prev[prev.length-1], gap = mDiff(p, m);
  const a = totalsAt(m), b = totalsAt(p), dOwed = owedAt(m) - owedAt(p);
  const cash = a.cash - b.cash + dOwed, shares = a.stocks - b.stocks;
  return {from:p, gap, cash, shares, total:cash + shares, dOwed};
}

/* the 1st-of-the-month plan, computed from the flows */
function plan(includeDad = true){
  const bal = {}; S.accounts.forEach(a => bal[a.id] = {in:0, out:0});
  const r = {bal, income:0, dadIn:0, spending:0, dadAdvance:0, toStocks:0, toSavings:0, checkingLeft:0};
  for (const f of S.flows) {
    const from = node(f.from), to = node(f.to), a = +f.amount || 0;
    if (!from || !to) continue;
    if (!includeDad && from.dad) continue;
    if (bal[f.from]) bal[f.from].out += a;
    if (bal[f.to]) bal[f.to].in += a;
    if (from.kind === 'income') from.dad ? r.dadIn += a : r.income += a;
    if (to.kind === 'expense') { r.spending += a; if (to.dad) r.dadAdvance += a; }
    const fa = acc(f.from), ta = acc(f.to);
    if (ta?.role === 'spending' && fa?.role !== 'spending') r.spending += a;
    if (fa?.role === 'spending' && ta && ta.role !== 'spending') r.spending -= a;
    if (ta?.group === 'stocks' && fa?.group !== 'stocks') r.toStocks += a;
    if (ta?.role === 'savings' && fa?.role !== 'savings') r.toSavings += a;
  }
  for (const a of S.accounts) if (a.role === 'checking') r.checkingLeft += bal[a.id].in - bal[a.id].out;
  r.capacity = r.income + r.dadIn - r.spending;
  return r;
}
const target = () => S.settings.targetMode === 'manual' ? (+S.settings.target || 0) : Math.max(0, Math.round(plan().capacity));

function dueMonth(){
  const t = today(), cur = ym(t), dim = new Date(t.getFullYear(), t.getMonth()+1, 0).getDate();
  if (t.getDate() >= Math.min(30, dim) && !hasSnap(cur)) return cur;
  const prev = addM(cur, -1);
  return hasSnap(prev) || hasSnap(cur) ? null : prev;
}
function defaultUpdateMonth(){
  const t = today(), cur = ym(t), prev = addM(cur, -1);
  if (t.getDate() >= 25) return cur;
  return hasSnap(prev) ? cur : prev;
}

/* dreams: funded in priority order (1, 2, 3…) from the balances of their accounts */
function dreamProgress(){
  const latest = snapMonths().pop();
  const pool = {}; S.accounts.forEach(a => pool[a.id] = latest ? Math.max(0, valueAt(a, latest) ?? lastValue(a) ?? 0) : 0);
  const start = {...pool};
  const sorted = [...S.dreams].sort((a, b) => (a.order ?? 1e9) - (b.order ?? 1e9));
  const out = {};
  for (const d of sorted) {
    if (d.kind === 'house') {          // ignores the other dreams: the whole net worth (cash + stocks + Alstom) is the budget
      const cash = latest ? Math.max(0, totalsAt(latest).net) : 0;
      out[d.id] = {got:cash, house:houseCalc(cash)};
      continue;
    }
    let need = +d.target || 0, got = 0;
    for (const id of d.accounts || []) { const take = Math.min(need - got, pool[id] || 0); if (take > 0) { got += take; pool[id] -= take; } }
    const left = Math.max(0, (+d.target || 0) - got);
    const months = d.deadline ? Math.max(1, mDiff(ym(today()), d.deadline)) : null;
    out[d.id] = {got, pct: d.target ? got / d.target : 0, left, months, perMonth: months ? left / months : null};
  }
  return {out, order: sorted};
}

const m2 = s => s < 10 ? (Math.floor(s * 10) / 10).toFixed(1) : String(Math.floor(s));   // 0.2 m² rather than 0 m²
/* affordable surface: cash = fee + S × [(down% + guarantee%) × (price + reno) + notary% × price] */
function houseCalc(cash){
  const h = S.settings.house, market = h.type === 'flat' ? h.priceFlat : h.priceHouse;
  const p = market * (1 - h.discount/100), r = h.renoCost[h.reno] ?? 0;
  const dn = h.downPct/100, g = h.guaranteePct/100, n = h.notaryPct/100;
  const perM2 = (dn + g) * (p + r) + n * p;
  const surf = perM2 > 0 ? Math.max(0, (cash - h.bankFee) / perM2) : 0;
  const purchase = surf * p, renov = surf * r, total = purchase + renov;
  let level = 0; LEVELS.forEach((l, i) => { if (surf >= l.min) level = i; });
  const next = LEVELS[level + 1], cashFor = s => h.bankFee + s * perM2;
  const lo = level ? cashFor(LEVELS[level].min) : 0, hi = next ? cashFor(next.min) : null;
  return {cash, market, p, r, perM2, surf, purchase, renov, total, level, next,
    down: dn*total, notary: n*purchase, guarantee: g*total, fee: h.bankFee, feeShort: Math.max(0, h.bankFee - cash), loan: total - dn*total,
    need: next ? Math.max(0, hi - cash) : 0, pct: next ? Math.max(0, Math.min(1, (cash - lo) / (hi - lo))) : 1};
}
/* animate only when new balances push the house up a level */
let animUntil = 0;
function levelUp(level){
  const h = S.settings.house, m = snapMonths().pop() || '';
  const up = h.lastLevel != null && level > h.lastLevel && h.lastMonth !== m;
  if (h.lastLevel !== level || h.lastMonth !== m) { h.lastLevel = level; h.lastMonth = m; save(); }
  if (up) { animUntil = Date.now() + 1500; setTimeout(() => toast(`Level up: ${LEVELS[level].name}! 🎉`), 400); }
  return Date.now() < animUntil;
}

function houseBlock(d, r, full){

  const icon = `<div class="house-ic ${up ? 'lvlup' : ''}">${houseIcon(c.level)}</div>`;
  const nextTxt = c.next ? `<b class="num">${eur(c.need)}</b> more cash → ${c.next.min} m² · ${c.next.name}` : 'Top level reached 🎉';
  const bar = `<div class="bar"><i style="width:${c.pct * 100}%"></i></div><div class="sub">${nextTxt}</div>`;

    ${line(`Down payment <span class="muted">(${h.downPct}% of total)</span>`, eur(c.down))}

    ${line('Bank application fee', eur(c.fee))}`}

/* ---------- views ---------- */
const ICON_WARN = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 2 20h20z"/><path d="M12 10v4M12 17.5v.01"/></svg>';

function banner(){
  const m = dueMonth();
  let h = '';
  if (m) h += `<div class="banner">${ICON_WARN}<div class="grow"><b>${ML[+m.slice(5)-1]} isn't updated yet</b><div class="sub" style="color:inherit">Takes 2 minutes.</div></div><button class="btn small" data-action="update" data-month="${m}">Update</button></div>`;
  const lb = S.settings.lastBackup, days = lb ? Math.floor((Date.now() - new Date(lb)) / 864e5) : null;
  if (snapMonths().length && (days == null || days > 35))
    h += `<div class="banner">${ICON_WARN}<div class="grow"><b>${days == null ? 'No backup yet' : `Last backup ${days} days ago`}</b><div class="sub" style="color:inherit">Data only lives on this phone.</div></div><button class="btn small" data-action="backup">Back up</button></div>`;
  return h;
}

function viewHome(){
  const ms = snapMonths(), latest = ms[ms.length-1];
  let h = banner();
  const standalone = navigator.standalone || matchMedia('(display-mode: standalone)').matches;
  if (/iPhone|iPad/.test(navigator.userAgent) && !standalone && !S.settings.hideInstallTip)
    h += `<div class="tip"><div class="grow">Install it: tap <b>Share</b> → <b>Add to Home Screen</b>, then always open it from the icon (Safari and the icon keep separate data).</div><button class="icon-btn" data-action="hideTip" aria-label="Dismiss">✕</button></div>`;

  const t = totalsAt(latest), prevM = ms[ms.length-2], d = prevM ? t.net - totalsAt(prevM).net : null;
  const owed = owedNow();
  h += `<div class="card">
    <div class="row"><h2 style="margin:0">Net worth · ${mLabel(latest, true)}</h2></div>
    <div class="hero num" style="margin-top:6px">${eur(t.net)}</div>
    ${d != null ? `<div class="delta num ${d >= 0 ? 'up' : 'down'}">${signed(d)} vs ${mLabel(prevM)}</div>` : ''}

  const sv = savedFor(latest), tg = target(), ratio = (+S.settings.sharesRatio || 0) / 100;
  if (sv) {

      <div class="row sub"><span>${Math.round(pct*100)}% of target</span><span>${pct >= 1 ? '<span class="ok">✓ on track</span>' : `<span class="ko">${eur(tgP - sv.total)} short</span>`}</span></div>
      <div class="row" style="margin-top:10px"><span>Savings (cash)</span><span class="num">${signed(sv.cash)} <span class="muted">/ ${eur(tgP*(1-ratio))}</span></span></div>
      <div class="row"><span>Shares</span><span class="num">${signed(sv.shares)} <span class="muted">/ ${eur(tgP*ratio)}</span></span></div>

let chartRange = 12, CH = null;
function stackChart(){
  const ms = snapMonths(); if (!ms.length) return '';
  const end = [ms[ms.length-1], dueMonth() || ''].sort().pop();
  let start = ms[0];
  if (chartRange && mDiff(start, end) > chartRange - 1) start = addM(end, -(chartRange - 1));
  const months = range(start, end);
  const accs = S.accounts.filter(a => a.group !== 'alstom' && months.some(m => S.snapshots[m]?.[a.id] != null)).sort((a, b) => a.color - b.color);
  const totals = months.map(m => hasSnap(m) ? totalsAt(m).liquid : null);

  const tg = target(), gs = S.settings.goalStart || ms[0];
  const baseM = ms.filter(m => m <= gs).pop() || ms[0], base = totalsAt(baseM).liquid;
  const goal = months.map(m => m >= gs ? base + tg * mDiff(gs, m) : null);

  const pts = totals.map((v, i) => [i, v]).filter(p => p[1] != null);
  let trend = null;
  if (pts.length >= 2) {
    const n = pts.length, sx = pts.reduce((s, p) => s + p[0], 0), sy = pts.reduce((s, p) => s + p[1], 0);
    const sxx = pts.reduce((s, p) => s + p[0]*p[0], 0), sxy = pts.reduce((s, p) => s + p[0]*p[1], 0);
    const k = (n*sxy - sx*sy) / (n*sxx - sx*sx), b0 = (sy - k*sx) / n;
    trend = months.map((_, i) => i >= pts[0][0] ? b0 + k*i : null);
  }
  const W = 340, H = 210, ml = 34, mr = 6, mt = 8, mb = 22, pw = W - ml - mr, ph = H - mt - mb;
  const maxV = Math.max(1, ...totals.filter(v => v != null), ...goal.filter(v => v != null), ...(trend || []).filter(v => v != null)) * 1.06;
  const rawStep = maxV / 4, mag = Math.pow(10, Math.floor(Math.log10(rawStep))), step = [1, 2, 2.5, 5, 10].map(x => x*mag).find(x => x >= rawStep);
  const yMax = Math.ceil(maxV / step) * step, y = v => mt + ph - (v / yMax) * ph;
  const band = pw / months.length, bw = Math.min(26, band * 0.62), cx = i => ml + band * (i + .5);

  let g = '<g class="grid">';
  for (let v = 0; v <= yMax + 1e-6; v += step) g += `<line x1="${ml}" x2="${W - mr}" y1="${y(v)}" y2="${y(v)}"/>`;
  g += '</g><g class="axis">';
  for (let v = 0; v <= yMax + 1e-6; v += step) g += `<text x="${ml - 5}" y="${y(v) + 3}" text-anchor="end">${kfmt(v)}</text>`;
  const every = Math.ceil(months.length / 6);
  months.forEach((m, i) => { if ((months.length - 1 - i) % every === 0) g += `<text x="${cx(i)}" y="${H - 6}" text-anchor="middle">${MN[+m.slice(5)-1]}${m.endsWith('-01') || i === 0 ? ' ' + m.slice(2, 4) : ''}</text>`; });
  g += '</g>';

  let bars = '';
  months.forEach((m, i) => {
    if (totals[i] == null) return;
    let acc0 = 0; const segs = accs.map(a => ({a, v: Math.max(0, S.snapshots[m]?.[a.id] ?? 0)})).filter(s => s.v > 0);
    segs.forEach((s, k) => {
      const y1 = y(acc0 + s.v), y0 = y(acc0), hgt = Math.max(0, y0 - y1 - (k ? 2 : 0)), x = cx(i) - bw/2;
      acc0 += s.v;
      if (hgt <= 0) return;
      const top = k === segs.length - 1, r = Math.min(4, hgt, bw/2);
      bars += top
        ? `<path d="M${x},${y1 + hgt} V${y1 + r} Q${x},${y1} ${x + r},${y1} H${x + bw - r} Q${x + bw},${y1} ${x + bw},${y1 + r} V${y1 + hgt} Z" fill="${color(s.a)}"/>`
        : `<rect x="${x}" y="${y1}" width="${bw}" height="${hgt}" fill="${color(s.a)}"/>`;
    });
  });
  const line = (arr, cls) => { const p = arr.map((v, i) => v == null ? null : `${cx(i)},${y(v)}`).filter(Boolean); return p.length > 1 ? `<polyline points="${p.join(' ')}" fill="none" ${cls}/>` : ''; };
  const lines = line(goal, 'stroke="var(--text)" stroke-width="2" stroke-dasharray="5 4"') + (trend ? line(trend, 'stroke="var(--text-2)" stroke-width="2" stroke-dasharray="1.5 3" stroke-linecap="round"') : '');
  const hits = months.map((m, i) => `<rect data-i="${i}" x="${ml + band*i}" y="${mt}" width="${band}" height="${ph}" fill="transparent"/>`).join('');
  CH = {months, accs, totals, goal, trend, W, cx};
  return `<div class="chart-wrap" id="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Stacked balances per account by month with target and trend lines">${g}${bars}${lines}<line id="cross" x1="0" x2="0" y1="${mt}" y2="${mt + ph}" stroke="var(--muted)" stroke-width="1" visibility="hidden"/>${hits}</svg><div class="ttip" id="ttip"></div></div>
    <div class="legend">${accs.map(a => `<span><i class="sw" style="background:${color(a)}"></i>${esc(a.name)}</span>`).join('')}<span><i class="ln"></i>Target (${eur(tg)}/mo)</span>${trend ? '<span><i class="ln trend"></i>Trend</span>' : ''}</div>`;
}

function spark(a){

  if (ms.length < 2) return '';

  const p = v.map((x, i) => `${(i/(v.length-1))*W},${H - 2 - ((x - mn) / ((mx - mn) || 1)) * (H - 4)}`).join(' ');
  return `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" aria-hidden="true"><polyline points="${p}" fill="none" stroke="${color(a)}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/></svg>`;
}

/* flows: a top-to-bottom chain of accounts, so no lines ever cross */
function flowColor(id){
  const n = node(id);
  if (acc(id)) return color(acc(id));
  return n.dad ? 'var(--s7)' : 'var(--muted)';
}
function flowDiagram(){
  const valid = S.flows.filter(f => node(f.from) && node(f.to) && +f.amount);
  if (!valid.length) return '<div class="card empty">No transfers yet.</div>';
  // an account is a step when money leaves it, or when income lands on it
  const hubs = [...new Set(valid.filter(f => acc(f.from) || (node(f.from).kind === 'income' && acc(f.to))).map(f => acc(f.from) ? f.from : f.to))];
  const depth = {}; hubs.forEach(id => depth[id] = 0);
  for (let it = 0; it < hubs.length; it++)
    for (const f of valid) if (depth[f.from] != null && depth[f.to] != null && depth[f.to] <= depth[f.from] && depth[f.from] < 8) depth[f.to] = depth[f.from] + 1;
  hubs.sort((a, b) => depth[a] - depth[b]);
  const sum = fs => fs.reduce((s, f) => s + +f.amount, 0);
  const p = plan();
  let h = '';
  hubs.forEach((id, k) => {
    const a = acc(id), prev = hubs[k - 1], next = hubs[k + 1];
    const fromPrev = prev ? valid.filter(f => f.from === prev && f.to === id) : [];
    const ins = valid.filter(f => f.to === id && f.from !== prev);
    if (fromPrev.length) h += `<div class="fl-link"><span class="num">↓ ${eur(sum(fromPrev), 1)}</span></div>`;
    else if (k) h += '<div style="height:8px"></div>';
    if (ins.length) h += `<div class="fl-in">${ins.map(f => `<button class="fl-chip ${node(f.from).dad ? 'dad' : ''}" data-action="editFlow" data-id="${f.id}">${esc(nodeName(f.from))} <b class="num">${eur(+f.amount, 1)}</b></button>`).join('')}</div><div class="fl-arrow">↓</div>`;
    const outs = valid.filter(f => f.from === id), byDest = {};
    outs.forEach(f => byDest[f.to] = (byDest[f.to] || 0) + +f.amount);
    // next step first, then same destinations together, biggest first
    outs.sort((x, y) => (y.to === next) - (x.to === next) || byDest[y.to] - byDest[x.to] || x.to.localeCompare(y.to) || y.amount - x.amount);
    const tin = p.bal[id].in, left = tin - p.bal[id].out, base = Math.max(tin, p.bal[id].out) || 1;
    const segs = outs.map(f => `<i style="flex:${+f.amount} 0 0;background:${flowColor(f.to)}" title="${esc(nodeName(f.to))}"></i>`).join('') +
      (left > 0.004 ? `<i style="flex:${left} 0 0;background:var(--surface-2);box-shadow:inset 0 0 0 1px var(--border)" title="Left on account"></i>` : '');
    h += `<div class="card fl-hub" style="border-left:4px solid ${color(a)}">
      <div class="row"><h3>${esc(a.name)}</h3><span class="num sub">in ${eur(tin, 1)}</span></div>
      <div class="fl-bar" role="img" aria-label="How ${esc(a.name)}'s money is split">${segs}</div>
      <ul class="list">${outs.map(f => `<li data-action="editFlow" data-id="${f.id}" style="cursor:pointer"><i class="sw" style="background:${flowColor(f.to)}"></i>
        <div class="grow"><div>${esc(nodeName(f.to))}${f.to === next ? ' <span class="muted">↓</span>' : ''}</div>${f.label ? `<div class="sub">${esc(f.label)}</div>` : ''}</div>
        <span class="num">${eur(+f.amount, 1)}</span><span class="sub num" style="width:34px;text-align:right">${Math.round(+f.amount / base * 100)}%</span></li>`).join('')}</ul>
      ${a.role !== 'spending' ? `<div class="row sep"><span>Left on account</span><b class="num ${left < -0.004 ? 'down' : ''}">${eur(left, 1)}</b></div>
      ${left < -0.004 ? `<div class="sub ko" style="margin-top:4px">Short by ${eur(-left, 1)} each month. Raise a transfer into ${esc(a.name)}.</div>` : ''}` : ''}
    </div>`;

  return h;
}

function fieldHTML(f, v){
  const hint = f.hint ? `<div class="hint">${f.hint}</div>` : '';
  if (f.type === 'select') return `<label class="field"><span>${f.label}</span><select name="${f.key}">${f.options.map(o => `<option value="${esc(o.v)}" ${String(o.v) === String(v ?? '') ? 'selected' : ''}>${esc(o.l)}</option>`).join('')}</select>${hint}</label>`;
  if (f.type === 'multi') return `<div class="field"><span>${f.label}</span><div class="checks">${f.options.map(o => `<label><input type="checkbox" name="${f.key}" value="${esc(o.v)}" ${(v || []).includes(o.v) ? 'checked' : ''}>${esc(o.l)}</label>`).join('')}</div>${hint}</div>`;
  if (f.type === 'check') return `<label class="check"><input type="checkbox" name="${f.key}" ${v ? 'checked' : ''}><span>${f.label}</span></label>${hint}`;
  const type = f.type === 'month' ? 'month' : 'text', im = f.type === 'number' ? 'inputmode="decimal"' : '';
  return `<label class="field"><span>${f.label}</span><input type="${type}" ${im} name="${f.key}" value="${esc(v ?? '')}" placeholder="${esc(f.placeholder || '')}" autocomplete="off">${hint}</label>`;
}
function openForm({title, fields, value = {}, onSave, onDelete, deleteLabel = 'Delete'}){
  const body = fields.map(f => fieldHTML(f, value[f.key])).join('') + (onDelete ? `<button class="btn danger block" data-del style="margin-top:20px">${deleteLabel}</button>` : '');
  openSheet(title, body, {onSave: sh => {
    const vals = {};
    for (const f of fields) {
      if (f.type === 'multi') vals[f.key] = [...sh.querySelectorAll(`[name="${f.key}"]:checked`)].map(i => i.value);
      else if (f.type === 'check') vals[f.key] = sh.querySelector(`[name="${f.key}"]`).checked;
      else { const raw = sh.querySelector(`[name="${f.key}"]`).value.trim(); vals[f.key] = f.type === 'number' ? num(raw) : raw; }
      if (f.required && (vals[f.key] == null || vals[f.key] === '')) { alert(`"${f.label}" is required.`); return false; }
    }
    onSave(vals); save();
  }});
  if (onDelete) $('#sheet [data-del]').addEventListener('click', () => { if (confirm('Delete this?')) { onDelete(); save(); closeSheet(); render(); } });
}

/* monthly update: the 2-minute screen */
function openUpdate(month){
  month ||= defaultUpdateMonth();
  const draw = () => {
    const accs = activeAccounts().sort((a, b) => (a.group === 'alstom') - (b.group === 'alstom'));
    const snap = S.snapshots[month] || {};
    const rows = accs.map(a => {
      const prev = lastValue(a, month), cur = snap[a.id], v = cur ?? prev;
      return `<li><i class="sw" style="background:${color(a)}"></i><div class="grow"><div class="name">${esc(a.name)}</div><div class="sub">${a.group === 'alstom' ? 'Yearly · leave as is if unchanged' : prev != null ? 'last ' + eur(prev, 1) : 'no previous value'}</div></div>
        <input data-acc="${a.id}" inputmode="decimal" value="${v != null ? String(v).replace('.', ',') : ''}" placeholder="0" aria-label="${esc(a.name)} balance" autocomplete="off"></li>`;
    }).join('');
    openSheet(mLabel(month, true), `
      <div class="month-pick"><button class="btn small" data-m="-1" aria-label="Previous month">‹</button><b>Balances at end of ${ML[+month.slice(5)-1]}</b><button class="btn small" data-m="1" aria-label="Next month">›</button></div>
      <p class="sub" style="margin:0">Pre-filled with last month. Only change what moved.</p>
      <ul class="list upd">${rows}</ul>
      <div class="card" style="margin-top:8px"><div class="row"><span>Total (without Alstom)</span><b class="num" id="updTotal"></b></div><div class="row sub"><span>Change</span><span class="num" id="updDelta"></span></div></div>
      ${hasSnap(month) ? `<button class="btn danger block" data-clear style="margin-top:12px">Clear ${mLabel(month)}</button>` : ''}`,
      {onSave: sh => {
        const s = {};
        sh.querySelectorAll('[data-acc]').forEach(i => { const v = num(i.value); if (v != null) s[i.dataset.acc] = v; });
        for (const a of S.accounts.filter(a => a.archived)) if (S.snapshots[month]?.[a.id] != null) s[a.id] = S.snapshots[month][a.id];
        S.snapshots[month] = s; save();
        setTimeout(afterUpdate, 50);
      }});
    const sh = $('#sheet');
    const prevM = snapMonths().filter(m => m < month).pop(), prevT = prevM ? totalsAt(prevM).liquid : null;
    const recalc = () => {
      let t = 0; sh.querySelectorAll('[data-acc]').forEach(i => { if (acc(i.dataset.acc).group !== 'alstom') t += num(i.value) || 0; });
      $('#updTotal').textContent = eur(t, 1);
      $('#updDelta').textContent = prevT != null ? signed(t - prevT, 1) + ' vs ' + mLabel(prevM) : '–';
    };
    sh.querySelectorAll('[data-acc]').forEach(i => { i.addEventListener('input', recalc); i.addEventListener('focus', () => setTimeout(() => i.select(), 0)); });
    sh.querySelectorAll('[data-m]').forEach(b => b.addEventListener('click', () => { month = addM(month, +b.dataset.m); draw(); }));
    sh.querySelector('[data-clear]')?.addEventListener('click', () => { if (confirm(`Remove all balances for ${mLabel(month, true)}?`)) { delete S.snapshots[month]; save(); closeSheet(); render(); } });
    recalc();
  };
  draw();
}
function afterUpdate(){
  const ms = snapMonths(), m = ms[ms.length-1], sv = m ? savedFor(m) : null, owed = owedNow();
  openSheet('Saved ✓', `<div class="welcome" style="padding:24px 0">

      ${owed > 0 ? `<div class="card" style="text-align:left"><div class="row"><span>Dad still owes</span><b class="num">${eur(owed, 1)}</b></div><div class="sub">Did he pay something back?</div><div class="btns"><button class="btn small" data-action="repay">Record a repayment</button></div></div>` : ''}

function openRepay(){
  openForm({title:'Repayment from Dad', fields:[
    {key:'amount', label:'Amount received (€)', type:'number', required:true, hint:'Applied to the oldest unpaid advances first.'},
    {key:'month', label:'Received in', type:'month'}], value:{month: ym(today())},
    onSave: v => {
      let rem = v.amount; const on = v.month || ym(today());
      for (const i of S.owed.items.filter(i => !i.received).sort((a, b) => a.month.localeCompare(b.month))) {
        if (rem <= 0.004) break;
        if (rem >= i.amount - 0.004) { i.received = true; i.receivedOn = on; rem -= i.amount; }
        else { S.owed.items.push({...i, id:uid(), amount: Math.round(rem*100)/100, received:true, receivedOn:on}); i.amount = Math.round((i.amount - rem)*100)/100; rem = 0; }
      }
      toast(rem > 0.004 ? `Recorded. ${eur(rem, 1)} more than owed.` : 'Repayment recorded');
    }});
}

/* ---------- backup / excel ---------- */
async function shareFile(blob, name){
  const file = new File([blob], name, {type: blob.type});
  if (navigator.canShare && navigator.canShare({files:[file]})) {
    try { await navigator.share({files:[file]}); return true; }
    catch(e){ if (e.name === 'AbortError') return false; }
  }
  const url = URL.createObjectURL(blob), a = document.createElement('a');
  a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 5000);
  return true;
}
async function backup(){
  const d = new Date(), name = `savings-backup-${ym(d)}-${pad(d.getDate())}.json`;
  const ok = await shareFile(new Blob([JSON.stringify(S, null, 1)], {type:'application/json'}), name);
  if (ok) { S.settings.lastBackup = new Date().toISOString(); save(); closeSheet(); render(); toast('Backup exported'); }
}
let xlsxP = null;
function loadXLSX(){
  if (window.XLSX) return Promise.resolve();
  return xlsxP ||= new Promise((res, rej) => { const s = document.createElement('script'); s.src = XLSX_URL; s.onload = res; s.onerror = () => { xlsxP = null; rej(new Error('Excel library not available offline yet. Open the app once with internet.')); }; document.head.appendChild(s); });
}
async function exportExcel(){
  try { await loadXLSX(); } catch(e){ return alert(e.message); }
  const wb = XLSX.utils.book_new(), ms = snapMonths();
  const bal = ms.map(m => { const r = {Month: mLabel(m, true)}; S.accounts.forEach(a => r[a.name] = S.snapshots[m]?.[a.id] ?? ''); const t = totalsAt(m), sv = savedFor(m);
    return Object.assign(r, {Cash:t.cash, Stocks:t.stocks, Alstom:t.alstom, 'Net worth':t.net, 'Owed to me':owedAt(m), 'Saved vs previous':sv ? Math.round(sv.total*100)/100 : ''}); });
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(bal), 'Balances');
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(S.flows.map(f => ({Day:1, From:nodeName(f.from), To:nodeName(f.to), Label:f.label || '', Amount:+f.amount}))), 'Flows (1st of month)');
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(S.owed.items.map(i => ({Advance:i.label, Month:mLabel(i.month, true), Amount:i.amount, Received:i.received ? 'Yes' : 'No', 'Received in':i.received ? mLabel(i.receivedOn || i.month, true) : ''}))), 'Owed to me');
  const {out} = dreamProgress();
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(S.dreams.map(d => ({Dream:d.name, Target:d.kind === 'house' ? '' : d.target, Deadline:d.deadline || '', Accounts:(d.accounts || []).map(nodeName).join(', '), Funded:Math.round(out[d.id].got),
    Progress:d.kind === 'house' ? `${m2(out[d.id].house.surf)} m² (${LEVELS[out[d.id].house.level].name}), project ${Math.round(out[d.id].house.total)} €` : Math.round(out[d.id].pct*100) + '%'}))), 'Dreams');
  const buf = XLSX.write(wb, {bookType:'xlsx', type:'array'});
  if (await shareFile(new Blob([buf], {type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}), `savings-${ym(today())}.xlsx`)) toast('Excel exported');
}
$('#importFile').addEventListener('change', async e => {
  const f = e.target.files[0]; e.target.value = ''; if (!f) return;
  try {
    const d = JSON.parse(await f.text());
    if (!Array.isArray(d.accounts) || typeof d.snapshots !== 'object') throw new Error('This is not a savings backup file.');
    if (S && !confirm('Replace everything on this phone with this backup?')) return;
    S = normalize(d); save(); location.hash = '#home'; render(); toast('Backup imported');
  } catch(err){ alert('Import failed: ' + err.message); }
});

    onSave: v => { r ? Object.assign(r, v) : S.owed.recurring.push({id:uid(), ...v}); materialize(); },
    deleteLabel:'Delete (keeps past advances)', onDelete: r && (() => S.owed.recurring = S.owed.recurring.filter(x => x !== r))});
}

const ACTIONS = {
  update: d => openUpdate(d.month),
  settings: () => { location.hash = '#settings'; },
  backup: () => backup(),
  excel: () => exportExcel(),
  import: () => $('#importFile').click(),
  startEmpty: () => { S = DEFAULT_STATE(); save(); render(); },
  hideTip: () => { S.settings.hideInstallTip = true; save(); render(); },
  chartRange: d => { chartRange = +d.r; render(); },
  addFlow: () => flowForm(), editFlow: d => flowForm(S.flows.find(f => f.id === d.id)),
  addParty: () => partyForm(), editParty: d => partyForm(party(d.id)),
  addAccount: () => accountForm(), editAccount: d => accountForm(acc(d.id)),
  addDream: () => dreamForm(), editDream: d => dreamForm(S.dreams.find(x => x.id === d.id)),
  addOwed: () => owedForm(), editOwed: d => owedForm(S.owed.items.find(x => x.id === d.id)),
  addRec: () => recForm(), editRec: d => recForm(S.owed.recurring.find(x => x.id === d.id)),
  repay: () => openRepay(),
  moveDream: d => {
    const ranked = S.dreams.filter(x => x.kind !== 'house').sort((a, b) => (a.order ?? 1e9) - (b.order ?? 1e9));
    const i = ranked.findIndex(x => x.id === d.id), j = i + +d.dir;
    if (i < 0 || j < 0 || j >= ranked.length) return;
    [ranked[i], ranked[j]] = [ranked[j], ranked[i]];
    ranked.forEach((x, k) => x.order = k + 1);
    save(); render();
  },
  houseType: d => { S.settings.house.type = d.v; save(); render(); },
  houseReno: d => { S.settings.house.reno = d.v; save(); render(); },
  editHouse: () => { const h = S.settings.house;
    openForm({title:'House project', value:{...h, light:h.renoCost.light, medium:h.renoCost.medium, heavy:h.renoCost.heavy},
      fields:[{key:'priceFlat', label:'Market price, flat (€/m²)', type:'number', required:true}, {key:'priceHouse', label:'Market price, house (€/m²)', type:'number', required:true},
        {key:'pricesUpdated', label:'Prices last updated', type:'month'}, {key:'discount', label:'Discount for work needed (%)', type:'number', required:true},
        {key:'reno', label:'Renovation level', type:'select', options:Object.entries(RENO).map(([v, l]) => ({v, l}))},
        {key:'light', label:'Light renovation (€/m²)', type:'number', required:true}, {key:'medium', label:'Medium renovation (€/m²)', type:'number', required:true}, {key:'heavy', label:'Heavy renovation (€/m²)', type:'number', required:true},
        {key:'downPct', label:'Down payment (% of total project)', type:'number', required:true}, {key:'notaryPct', label:'Notary fees (% of purchase price)', type:'number', required:true},
        {key:'guaranteePct', label:'Loan guarantee (% of total project)', type:'number', required:true}, {key:'bankFee', label:'Bank application fee (€)', type:'number', required:true}],
      onSave: v => { const {light, medium, heavy, ...rest} = v; Object.assign(h, rest, {renoCost:{light, medium, heavy}}); }}); },
  toggleOwed: (d, el) => { const i = S.owed.items.find(x => x.id === d.id); i.received = el.checked; i.receivedOn = el.checked ? ym(today()) : undefined; save(); render(); },
  editTarget: () => openForm({title:'Monthly target', value:{...S.settings, ratio:S.settings.sharesRatio},
    fields:[{key:'targetMode', label:'Target', type:'select', options:[{v:'auto', l:`Automatic (${eur(Math.max(0, plan().capacity))}/month from your flows)`}, {v:'manual', l:'Set by hand'}]},
      {key:'target', label:'Manual target (€/month)', type:'number'}, {key:'ratio', label:'Share of the target going to shares (%)', type:'number'},
      {key:'goalStart', label:'Target line starts in', type:'month', hint:'The chart target line grows from your balance this month.'}],
    onSave: v => Object.assign(S.settings, {targetMode:v.targetMode, target:v.target || 0, sharesRatio:Math.min(100, Math.max(0, v.ratio ?? 50)), goalStart:v.goalStart || null})}),
  reset: () => { if (confirm('Erase ALL data on this phone? Export a backup first.') && confirm('Really erase everything?')) { localStorage.removeItem(KEY); S = null; location.hash = ''; render(); } }
};
document.addEventListener('click', e => {
  const el = e.target.closest('[data-action]'); if (!el) return;
  if (el.type === 'checkbox' && el.dataset.action !== 'toggleOwed') return;
  const fn = ACTIONS[el.dataset.action]; if (fn) { if (el.tagName === 'A') e.preventDefault(); fn(el.dataset, el); }
});
document.addEventListener('pointermove', e => { const r = e.target.closest?.('#chart [data-i]'); if (r) chartTip(+r.dataset.i); else if (!e.target.closest?.('#chart')) chartHide(); });
document.addEventListener('pointerdown', e => { const r = e.target.closest?.('#chart [data-i]'); if (r) chartTip(+r.dataset.i); else chartHide(); });

/* ---------- start ---------- */
S = load();
render();
navigator.storage?.persist?.();
if ('serviceWorker' in navigator && location.protocol !== 'file:') navigator.serviceWorker.register('sw.js');
setTimeout(() => loadXLSX().catch(() => {}), 3000);
</script>
</body>
</html>
